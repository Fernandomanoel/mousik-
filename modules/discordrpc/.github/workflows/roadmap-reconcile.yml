name: Reconcile the mousike Roadmap

on:
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show planned transitions without changing GitHub or saving state
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  reconcile:
    uses: N-Zik-Group/mousike-Theme-Store/.github/workflows/roadmap-reconcile-shared.yml@main
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      ROADMAP_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
